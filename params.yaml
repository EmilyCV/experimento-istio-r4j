# =============================================================================
# params.yaml — Parâmetros únicos de resiliência (retry, timeout, circuit breaker)
#
# Este arquivo é a fonte única de verdade. Os valores aqui são usados para
# gerar/preencher tanto os manifests do Istio quanto o application.yaml do R4J.
# =============================================================================

# --- Timeout ---
timeout:
  perTryMs: 500          # Timeout por tentativa individual
  totalMs: 2000          # Timeout total da chamada (incluindo retries)

# --- Retry ---
retry:
  maxAttempts: 3         # Total de tentativas (incluindo a primeira)
                         # Istio: retries.attempts = 2 (não conta a primeira)
                         # R4J: maxAttempts = 3 (conta a primeira)
  retryOn: "5xx,reset,connect-failure,gateway-error"
  waitDurationMs: 25     # Backoff entre tentativas
                         # Envoy padrão: 25ms base com jitter (documentado abaixo)
                         # R4J: waitDuration = 25ms (sem jitter para simplificar)

# --- Circuit Breaker ---
circuitBreaker:
  # -- Istio (outlierDetection na DestinationRule) --
  istio:
    consecutiveErrors: 5           # consecutive5xxErrors
    intervalS: 10                  # interval entre análises
    baseEjectionTimeS: 30          # tempo mínimo de ejeção
    maxEjectionPercent: 100        # permite ejetar todas as instâncias
  # -- Resilience4j --
  r4j:
    slidingWindowType: COUNT_BASED
    slidingWindowSize: 10
    failureRateThreshold: 50       # abre com >= 50% de falhas na janela
    waitDurationInOpenStateS: 30   # tempo em estado aberto
    permittedNumberOfCallsInHalfOpenState: 3
    minimumNumberOfCalls: 5

# --- Connection Pool (Istio) ---
connectionPool:
  tcp:
    maxConnections: 100
  http:
    h2UpgradePolicy: DEFAULT
    http1MaxPendingRequests: 100
    http2MaxRequests: 100

# --- Carga (k6) ---
load:
  warmupDurationS: 60
  testDurationS: 180
  rpsTarget: 0           # 0 = definido pela calibração (etapa 5)
  vuMax: 50              # máximo de VUs

# --- Injeção de falhas (service-c) ---
faults:
  S2:
    delayMs: 800
    delayPercent: 50
  S3:
    errorPercent: 30
    errorStatus: 503
  S4:
    errorPercent: 100
    errorStatus: 503
    durationS: 60
  S5:
    # S4 seguido de reset
    errorPercent: 100
    errorStatus: 503
    faultDurationS: 60
    # após faultDurationS, chama /admin/fault com reset=true
  S6:
    errorPercent: 30
    errorStatus: 503
    # rodado no namespace exp-both (retry Istio + R4J simultâneos)

# --- Réplicas ---
replicas:
  serviceA: 1
  serviceB: 1
  serviceC: 2            # 2 réplicas para outlier detection funcionar

# --- Recursos por pod de aplicação (iguais em todas as variantes) ---
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# --- Repetições ---
experiment:
  repetitions: 5
