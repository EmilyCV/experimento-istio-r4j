server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: resilience-service
  lifecycle:
    timeout-per-shutdown-phase: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,circuitbreakers,circuitbreakerevents,retries,retryevents
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${SERVICE_ROLE:unknown}

app:
  http:
    connect-timeout-ms: 500
    read-timeout-ms: 3000
  cpu-work-ms: 5
