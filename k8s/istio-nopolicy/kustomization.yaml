apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sidecar injected (namespace label), but NO VirtualService/DestinationRule
# Isolates the cost of the Envoy proxy from the cost of resilience policies
namespace: exp-istio-nopolicy

resources:
  - ../base

patches:
  - target:
      kind: Deployment
      name: service-a
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "service-a,istio"
  - target:
      kind: Deployment
      name: service-b
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "service-b,istio"
  - target:
      kind: Deployment
      name: service-c
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "service-c,istio"
