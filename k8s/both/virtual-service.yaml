apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: service-b-vs
spec:
  hosts:
    - service-b
  http:
    - route:
        - destination:
            host: service-b
      timeout: 2s
      retries:
        attempts: 2
        perTryTimeout: 500ms
        retryOn: 5xx,reset,connect-failure,gateway-error
