# service-b: responde GET /api/b/{id} com um trabalho de CPU de 5 ms.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: app
          image: resilience-service:1.0
          # A imagem é carregada no kind com "kind load"; nunca é baixada da internet.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "service-b"
          # Iguais em todas as variantes. requests = limits: o Kubernetes reserva
          # exatamente esse valor (classe "Guaranteed"), o que deixa a medição mais estável.
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          # O Spring demora para subir no kind: espera até 2 min (60 x 2 s) antes de desistir.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
          # Só recebe tráfego quando estiver pronto.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: baseline
spec:
  selector:
    app: service-b
  ports:
    # O nome "http" diz ao Istio que o protocolo é HTTP (importante na variante istio).
    - name: http
      port: 8080
      targetPort: 8080
