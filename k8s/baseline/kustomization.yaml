apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: exp-baseline

resources:
  - ../base

patches:
  - target:
      kind: Deployment
      name: service-a
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "service-a,baseline"
  - target:
      kind: Deployment
      name: service-b
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "service-b,baseline"
  - target:
      kind: Deployment
      name: service-c
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "service-c,baseline"
