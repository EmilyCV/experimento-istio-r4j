# kind cluster configuration for the experiment
# 1 control-plane + 2 workers (enough for service distribution)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      # Grafana NodePort
      - containerPort: 30300
        hostPort: 30300
        protocol: TCP
      # Prometheus NodePort
      - containerPort: 30900
        hostPort: 30900
        protocol: TCP
  - role: worker
  - role: worker
