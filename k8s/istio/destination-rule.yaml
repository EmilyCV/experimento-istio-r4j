# DestinationRule: circuit breaker (outlier detection) + connection pool
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: service-b-dr
spec:
  host: service-b
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: DEFAULT
        http1MaxPendingRequests: 100
        http2MaxRequests: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
---
